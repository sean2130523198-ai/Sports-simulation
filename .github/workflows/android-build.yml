name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

    - name: Install Rust and Target
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source $HOME/.cargo/env
        rustup target add aarch64-linux-android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: ./android
      run: |
        ./gradlew assembleRelease --no-daemon
        # 如果项目强制要求通过 build.ps1 构建，请将上一行替换为：
        # pwsh ./build.ps1 -Abi arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sports-simulation-arm64-v8a.apk
        path: android/build/arm64-v8a-release/Sports-simulation-arm64-v8a.apk
